<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard NOSO Professional</title>
    <link type="image/png" sizes="16x16" rel="icon" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --noso-azul: #1a365d; --noso-azul-claro: #2b6cb0; --noso-rojo: #e53e3e; --fondo: #f0f4f8; --texto: #2d3748; --card: #ffffff; --hover: #edf2f7; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--fondo); color: var(--texto); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .historial-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        .historial-table th { background-color: var(--noso-azul); color: white; padding: 15px; text-align: left; }
        .historial-table td { padding: 15px; border-bottom: 1px solid #eee; }
        
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chart-box { max-width: 400px; margin: 0 auto; }
        .filter-section { margin-bottom: 20px; display: flex; gap: 10px; }

        /* CLASE UNIFICADA: padding, altura, fuente y centrado iguales para ambos */
        .control-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            padding: 0 25px;
            background-color: var(--card);
            border: 2px solid var(--noso-azul-claro);
            color: var(--noso-azul);
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            transition: 0.3s;
            box-sizing: border-box;
            font-family: inherit; /* Fuerza la misma fuente */
            line-height: normal;
        }

        #filtroMes {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%231A365D%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 10px auto;
            padding-right: 45px;
        }

        .control-btn:hover { background-color: var(--noso-azul); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dashboard de Mantenimiento y Reparaciones 🧰</h1>
    
    <div class="filter-section">
        <select id="filtroMes" class="control-btn" onchange="filtrarDatos()">
            <option value="todos">📅 Todos los meses</option>
            <option value="07">Julio</option>
            <option value="06">Junio</option>
        </select>
        <a href="index.html" class="control-btn">🔄 Volver atrás..</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total Servicios</h3><p id="totalServicios">0</p></div>
        <div class="stat-card"><h3>Recaudación Total</h3><p id="totalRecaudado">$0</p></div>
        <div class="stat-card"><h3>Promedio Servicio</h3><p id="promedioServicio">$0</p></div>
    </div>

    <table class="historial-table">
        <thead><tr><th>Fecha</th><th>Cliente</th><th>Categoría</th><th>Marca</th><th>Presupuesto ($)</th></tr></thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <div class="bottom-grid">
        <div class="card">
            <h3 style="color: var(--noso-azul);">🏆 Top de Clientes Estrella</h3>
            <div id="listaRanking"></div>
        </div>
        <div class="card">
            <h3 style="color: var(--noso-azul);">Distribución por Equipo</h3>
            <div class="chart-box"><canvas id="miTorta"></canvas></div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3 style="color: var(--noso-azul);">📈 Ingresos Mensuales</h3>
        <canvas id="miBarra" style="max-height: 200px;"></canvas>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let datosGlobales = [];
    let miGrafico, miGraficoBarra;

    async function cargarDatos() {
        const querySnapshot = await getDocs(collection(db, "servicios"));
        datosGlobales = [];
        querySnapshot.forEach(doc => datosGlobales.push(doc.data()));
        renderizar(datosGlobales);
    }

    window.filtrarDatos = () => {
        const mes = document.getElementById('filtroMes').value;
        const filtrados = mes === 'todos' ? datosGlobales : datosGlobales.filter(f => f.fecha.split('/')[1] === mes);
        renderizar(filtrados);
    };

    function renderizar(datos) {
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = "";
        let sumaTotal = 0, frecuencia = {}, cats = {}, ingresosMes = new Array(12).fill(0);

        datos.forEach(f => {
            sumaTotal += parseFloat(f.presupuesto || 0);
            frecuencia[f.cliente] = (frecuencia[f.cliente] || 0) + 1;
            cats[f.categoria] = (cats[f.categoria] || 0) + 1;
            const mes = parseInt(f.fecha.split('/')[1]);
            if(mes) ingresosMes[mes-1] += parseFloat(f.presupuesto || 0);
            cuerpo.innerHTML += `<tr><td>${f.fecha}</td><td>${f.cliente}</td><td>${f.categoria}</td><td>${f.marca}</td><td>$${parseFloat(f.presupuesto).toLocaleString()}</td></tr>`;
        });

        document.getElementById('totalServicios').innerText = datos.length;
        document.getElementById('totalRecaudado').innerText = `$${sumaTotal.toLocaleString()}`;
        document.getElementById('promedioServicio').innerText = datos.length ? `$${Math.round(sumaTotal/datos.length)}` : '$0';
        document.getElementById('listaRanking').innerHTML = Object.entries(frecuencia).sort((a,b) => b[1]-a[1]).slice(0,3).map(c => `<p>⭐ ${c[0]} (${c[1]} serv.)</p>`).join('');

        const ctx = document.getElementById('miTorta').getContext('2d');
        if(miGrafico) miGrafico.destroy();
        miGrafico = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(cats), datasets: [{ data: Object.values(cats), backgroundColor: ['#1a365d', '#2b6cb0', '#5BC0BE'] }] }, options: { responsive: true, plugins: { legend: { position: 'bottom' } } } });

        const ctxBar = document.getElementById('miBarra').getContext('2d');
        if(miGraficoBarra) miGraficoBarra.destroy();
        miGraficoBarra = new Chart(ctxBar, { type: 'bar', data: { labels: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'], datasets: [{ label: 'Ingresos ($)', data: ingresosMes, backgroundColor: '#2b6cb0' }] } });
    }

    cargarDatos();
</script>
</body>
</html>
