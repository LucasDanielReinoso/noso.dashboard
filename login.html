<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Credenciales • NOSO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link type="image/png" sizes="16x16" rel="icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#040813">

    <style>
      :root {
        --bg: #040813;
        --panel: rgba(8, 13, 27, 0.88);
        --panel-strong: rgba(13, 21, 40, 0.96);
        --border: rgba(255, 255, 255, 0.16);
        --text: #f7f9ff;
        --muted: #a0aec0;
        --muted-soft: rgba(160, 174, 192, 0.9);
        --accent: #315cf7;
        --accent-glow: #5f7cff;
        --accent-btn: linear-gradient(135deg, #315cf7, #5f7cff);
        --danger: #ff5a8a;
        --success: #22c55e;
        --shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        --input-bg: rgba(255, 255, 255, 0.07);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: 'Inter', "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(88px);
        opacity: 0.5;
        animation: float 10s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        top: -80px;
        left: -60px;
        background: rgba(49, 92, 247, 0.3);
      }

      body::after {
        right: -70px;
        bottom: -80px;
        background: rgba(95, 124, 255, 0.25);
        animation-duration: 12s;
      }

      @keyframes float {
        from { transform: translateY(0px) scale(1); }
        to { transform: translateY(25px) scale(1.05); }
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(100%, 1000px);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        border: 1px solid var(--border);
        border-radius: 32px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px);
        background: var(--panel);
        transition: all 0.35s ease;
      }

      .shell.register-mode {
        grid-template-columns: minmax(0, 1fr);
      }

      .hero.is-hidden {
        display: none;
      }

      .hero {
        padding: 44px;
        background: linear-gradient(145deg, rgba(11, 17, 36, 0.95), rgba(23, 31, 58, 0.8));
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }

      /* CABECERA CON LOGO EL DOBLE DE GRANDE Y CENTRADO */
      .brand-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 16px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        font-weight: 700;
        letter-spacing: 0.02em;
        backdrop-filter: blur(10px);
        white-space: nowrap;
      }

      /* Logo tamaño duplicado (144px) */
      .brand-badge {
        width: 144px;
        height: 144px;
        border-radius: 50%;
        object-fit: contain;
        display: block;
        flex-shrink: 0;
        filter: drop-shadow(0 0 24px rgba(49, 92, 247, 0.65));
      }

      .hero h1 {
        font-size: clamp(1.8rem, 2.5vw, 2.4rem);
        line-height: 1.2;
        margin: 24px 0 12px;
        font-weight: 800;
        text-align: center;
      }

      .hero p {
        margin: 0;
        color: var(--muted-soft);
        font-size: 1rem;
        line-height: 1.6;
        text-align: center;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 28px;
      }

      .stats span {
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Control del tamaño y alineado de los SVGs en las etiquetas stats */
      .stats span svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        flex-shrink: 0;
        display: inline-block;
        vertical-align: middle;
      }

      .card {
        padding: 40px;
        background: var(--panel);
        backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 100%;
      }

      .card > * {
        width: min(100%, 380px);
      }

      .tab-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: rgba(0,0,0,0.12);
        border: 1px solid var(--border);
        padding: 5px;
        border-radius: 999px;
        margin-bottom: 24px;
      }

      .tab-switch button {
        border: 0;
        border-radius: 999px;
        padding: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .tab-switch button.active {
        color: #fff;
        background: var(--accent-btn);
        box-shadow: 0 8px 20px rgba(49, 92, 247, 0.3);
      }

      form {
        display: none;
        flex-direction: column;
        gap: 18px;
        width: min(100%, 380px);
      }

      form.active {
        display: flex;
        animation: formFade 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes formFade {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text);
        padding-left: 2px;
      }

      .input-wrap {
        position: relative;
      }

      input,
      select {
        width: 100%;
        height: 52px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
        padding: 0 48px 0 16px;
        border-radius: 16px;
        font-size: 1rem;
        font-family: inherit;
        outline: none;
        transition: all 0.25s ease;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(49, 92, 247, 0.2);
      }

      select {
        appearance: none;
        cursor: pointer;
      }

      select option {
        color: #0b1120;
        background-color: #ffffff;
      }

      .input-wrap .icon {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .input-wrap .icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }

      .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
      }

      .toggle-password:hover {
        color: var(--text);
      }

      .toggle-password svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }

      .helper-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      button[type="submit"] {
        border: 0;
        height: 54px;
        border-radius: 16px;
        font-size: 1.05rem;
        font-weight: 800;
        color: white;
        cursor: pointer;
        background: var(--accent-btn);
        box-shadow: 0 12px 28px rgba(49, 92, 247, 0.3);
        transition: all 0.2s ease;
        margin-top: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      button[type="submit"]:active {
        transform: scale(0.98);
      }

      button[type="submit"]:disabled {
        opacity: 0.75;
        cursor: not-allowed;
      }

      /* BOTÓN SECUNDARIO: DESCARGAR APP (AZUL MATE SOBRIO) */
      .btn-download-app {
        border: 1px solid rgba(112, 144, 212, 0.3);
        height: 48px;
        border-radius: 16px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #9bb3f2;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.04);
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-top: 10px;
      }

      .btn-download-app:hover {
        background: rgba(49, 92, 247, 0.12);
        border-color: rgba(95, 124, 255, 0.5);
        color: #ffffff;
      }

      .btn-download-app:active {
        transform: scale(0.98);
      }

      .btn-download-app svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .message {
        min-height: 20px;
        font-size: 0.9rem;
        text-align: center;
        font-weight: 600;
      }

      .message.success { color: var(--success); }
      .message.error { color: var(--danger); }

      .link-btn {
        border: 0;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        padding: 0;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .footer-note {
        margin-top: 0px;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        line-height: 1.4;
      }

      @media (max-width: 820px) {
        body {
          padding: 10px;
          align-items: flex-start;
        }

        .shell {
          grid-template-columns: 1fr;
          border-radius: 24px;
        }

        .hero {
          padding: 24px 20px 16px;
          background: transparent;
        }

        .hero h1 {
          font-size: 1.5rem;
          margin: 14px 0 8px;
        }

        .hero p { font-size: 0.9rem; }

        .stats {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          margin-top: 14px;
        }

        .stats span {
          padding: 8px 10px;
          font-size: 0.82rem;
          border-radius: 12px;
        }

        .card { padding: 20px 20px 28px; }

        input, select, button[type="submit"] {
          height: 50px;
        }
      }

      @media (max-width: 480px) {
        body { padding: 0; }

        .shell {
          border-radius: 0;
          min-height: 100vh;
          min-height: 100dvh;
          border: none;
        }

        .hero { padding: 28px 20px 12px; }
        .brand { padding: 8px 14px; font-size: 0.88rem; }
        .brand-badge { width: 120px; height: 120px; }
        .stats { display: none; }
        .card { padding: 10px 20px 32px; }
      }
    </style>
  </head>
  <body>

    <div class="shell">
      <section class="hero" id="hero-panel">
        <div>
          <!-- CABECERA CON LOGO DUPLICADO Y CENTRADO -->
          <div class="brand-row">
            <img class="brand-badge" src="icono.png" alt="Logo NOSO" />
            <div class="brand">DASHBOARD • Refrigeración</div>
          </div>
          <h1>Planillas digitales para tu servicio técnico</h1>
          <p>Accede con tu cuenta para consultar tu historial, cargar fichas e insumos desde cualquier lugar.</p>
          <div class="stats">
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 0 0 4.5 4.5H18a3.75 3.75 0 0 0 1.332-7.257 3 3 0 0 0-3.758-3.848 5.25 5.25 0 0 0-10.233 2.33A4.502 4.502 0 0 0 2.25 15Z" />
              </svg>
              En la nube
            </span>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
              </svg>
              Celular & PC
            </span>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
              </svg>
              Historial
            </span>
            <span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
              </svg>
              Tiempo real
            </span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="tab-switch" role="tablist" aria-label="Alternar entre login y registro">
          <button class="active" id="tab-login" type="button">Iniciar sesión</button>
          <button id="tab-register" type="button">Crear cuenta</button>
        </div>

        <form id="login-form" class="active">
          <div class="field">
            <label for="login-email">Correo electrónico</label>
            <div class="input-wrap">
              <input id="login-email" name="email" type="email" placeholder="tu@email.com" autocomplete="username" required />
              <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="login-password">Contraseña</label>
            <div class="input-wrap">
              <input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="toggle-password" title="Mostrar/ocultar contraseña" onclick="toggleVisibility('login-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <div class="helper-row">
            <label class="check">
              <input type="checkbox" />
              Recordarme
            </label>
            <button type="button" class="link-btn">¿Olvidaste la clave?</button>
          </div>

          <button type="submit" id="btn-login-submit">
            <div class="spinner" id="login-spinner"></div>
            <span id="login-btn-text">Entrar ahora</span>
          </button>

          <button type="button" class="btn-download-app" id="btnDownloadApp">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            <span>Descargar App NOSO</span>
          </button>

          <div id="login-message" class="message"></div>
        </form>

        <form id="register-form">
          <div class="field">
            <label for="register-name">Nombre y Apellido</label>
            <div class="input-wrap">
              <input id="register-name" name="name" type="text" placeholder="Ej: Lucas Reinoso" autocomplete="name" required />
              <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="register-email">Correo electrónico</label>
            <div class="input-wrap">
              <input id="register-email" name="email" type="email" placeholder="tu@email.com" autocomplete="email" required />
              <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="register-country">País</label>
            <div class="input-wrap">
              <select id="register-country" name="country" required>
                <option value="">Selecciona tu país</option>
                <option value="🇦🇷 Argentina">🇦🇷 Argentina</option>
                <option value="🇧🇴 Bolivia">🇧🇴 Bolivia</option>
                <option value="🇨🇱 Chile">🇨🇱 Chile</option>
                <option value="🇨🇴 Colombia">🇨🇴 Colombia</option>
                <option value="🇨🇷 Costa Rica">🇨🇷 Costa Rica</option>
                <option value="🇪🇨 Ecuador">🇪🇨 Ecuador</option>
                <option value="🇲🇽 México">🇲🇽 México</option>
                <option value="🇵🇪 Perú">🇵🇪 Perú</option>
                <option value="🇵🇾 Paraguay">🇵🇾 Paraguay</option>
                <option value="🇺🇾 Uruguay">🇺🇾 Uruguay</option>
                <option value="🇻🇪 Venezuela">🇻🇪 Venezuela</option>
                <option value="🇪🇸 España">🇪🇸 España</option>
                <option value="🇺🇸 Estados Unidos">🇺🇸 Estados Unidos</option>
              </select>
              <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m20.893 13.393-1.135-1.135a2.252 2.252 0 0 1-.421-.585l-1.08-2.16a.414.414 0 0 0-.663-.107.827.827 0 0 1-.812.21l-1.273-.363a.89.89 0 0 0-.738 1.595l.587.39c.59.395.674 1.23.172 1.732l-.2.2c-.212.212-.33.498-.33.796v.41c0 .409-.11.809-.32 1.158l-1.315 2.191a2.11 2.11 0 0 1-1.81 1.025 1.055 1.055 0 0 1-1.055-1.055v-1.172c0-.92-.56-1.747-1.414-2.089l-.655-.261a2.25 2.25 0 0 1-1.383-2.46l.007-.042a2.25 2.25 0 0 1 .29-.787l.09-.15a2.25 2.25 0 0 1 2.37-1.048l1.178.236a1.125 1.125 0 0 0 1.302-.795l.208-.73a1.125 1.125 0 0 0-.578-1.315l-.665-.332-.091.091a2.25 2.25 0 0 1-1.591.659h-.18c-.249 0-.487.1-.662.274a.931.931 0 0 1-1.458-1.137l1.411-2.353a2.25 2.25 0 0 0 .286-.76m11.928 9.869A9 9 0 0 0 8.965 3.525m11.928 9.868A9 9 0 1 1 8.965 3.525" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="register-company">Nombre de tu empresa</label>
            <div class="input-wrap">
              <input id="register-company" name="companyName" type="text" placeholder="Ej: NOSO Refrigeración" autocomplete="organization" required />
              <span class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="register-password">Contraseña</label>
            <div class="input-wrap">
              <input id="register-password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required />
              <button type="button" class="toggle-password" title="Mostrar/ocultar contraseña" onclick="toggleVisibility('register-password', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="register-confirm">Confirmar contraseña</label>
            <div class="input-wrap">
              <input id="register-confirm" name="confirm" type="password" placeholder="Repite tu contraseña" autocomplete="new-password" required />
              <button type="button" class="toggle-password" title="Mostrar/ocultar contraseña" onclick="toggleVisibility('register-confirm', this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-register-submit">
            <div class="spinner" id="register-spinner"></div>
            <span id="register-btn-text">Crear mi cuenta</span>
          </button>
          <div id="register-message" class="message"></div>
        </form>

        <div class="footer-note">Sincronizado con Firebase Cloud Auth. Tus datos están seguros y protegidos.</div>
      </section>
    </div>

    <script>
      const svgEyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>`;

      const svgEyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>`;

      function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
          input.type = 'text';
          btn.innerHTML = svgEyeOpen;
        } else {
          input.type = 'password';
          btn.innerHTML = svgEyeClosed;
        }
      }

      let deferredPrompt;
      const btnDownloadApp = document.getElementById('btnDownloadApp');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      btnDownloadApp?.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            btnDownloadApp.style.display = 'none';
          }
          deferredPrompt = null;
        } else {
          alert("Para instalar en tu teléfono:\n\n• En Android (Chrome): Toca los 3 puntos superiores y selecciona 'Añadir a la pantalla de inicio'.\n• En iPhone (Safari): Toca el botón 'Compartir' y selecciona 'Añadir a la pantalla de inicio'.");
        }
      });
    </script>

    <!-- Módulos oficiales de Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword 
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import { 
        getFirestore, 
        doc, 
        setDoc 
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCxGfy4Y4F4C3dPoXUOuXoxZfAfX7ljY2w",
        authDomain: "noso-pro.firebaseapp.com",
        projectId: "noso-pro",
        storageBucket: "noso-pro.firebasestorage.app",
        messagingSenderId: "801843860180",
        appId: "1:801843860180:web:bc166745f954eb080e6141"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      const loginMessage = document.getElementById('login-message');
      const registerMessage = document.getElementById('register-message');

      function showMessage(el, text, type = '') {
        el.textContent = text;
        el.className = `message ${type}`.trim();
      }

      function setLoading(btnId, spinnerId, textId, isLoading, defaultText) {
        const btn = document.getElementById(btnId);
        const spinner = document.getElementById(spinnerId);
        const textSpan = document.getElementById(textId);

        btn.disabled = isLoading;
        spinner.style.display = isLoading ? 'block' : 'none';
        textSpan.textContent = isLoading ? 'Procesando...' : defaultText;
      }

      function switchTab(target) {
        loginTab.classList.toggle('active', target === 'login');
        registerTab.classList.toggle('active', target === 'register');
        loginForm.classList.toggle('active', target === 'login');
        registerForm.classList.toggle('active', target === 'register');

        const shell = document.querySelector('.shell');
        const hero = document.getElementById('hero-panel');
        if (shell) shell.classList.toggle('register-mode', target === 'register');
        if (hero) hero.classList.toggle('is-hidden', target === 'register');
      }

      loginTab.addEventListener('click', () => switchTab('login'));
      registerTab.addEventListener('click', () => switchTab('register'));

      // --- INICIAR SESIÓN CON FIREBASE ---
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        showMessage(loginMessage, '', '');
        setLoading('btn-login-submit', 'login-spinner', 'login-btn-text', true, 'Entrar ahora');

        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          showMessage(loginMessage, `¡Bienvenido! Redirigiendo...`, 'success');
          
          setTimeout(() => {
            window.location.href = 'index.html'; 
          }, 1000);

        } catch (error) {
          console.error(error);
          setLoading('btn-login-submit', 'login-spinner', 'login-btn-text', false, 'Entrar ahora');
          if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
            showMessage(loginMessage, 'Correo o contraseña incorrectos.', 'error');
          } else {
            showMessage(loginMessage, 'Error al iniciar sesión. Intenta nuevamente.', 'error');
          }
        }
      });

      // --- CREAR CUENTA EN FIREBASE AUTH + FIRESTORE ---
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const country = document.getElementById('register-country').value.trim();
        const companyName = document.getElementById('register-company').value.trim();
        const password = document.getElementById('register-password').value;
        const confirm = document.getElementById('register-confirm').value;

        if (!name || !email || !country || !companyName || !password) {
          showMessage(registerMessage, 'Completa todos los campos.', 'error');
          return;
        }

        if (password.length < 6) {
          showMessage(registerMessage, 'La contraseña debe tener al menos 6 caracteres.', 'error');
          return;
        }

        if (password !== confirm) {
          showMessage(registerMessage, 'Las contraseñas no coinciden.', 'error');
          return;
        }

        showMessage(registerMessage, '', '');
        setLoading('btn-register-submit', 'register-spinner', 'register-btn-text', true, 'Crear mi cuenta');

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            name: name,
            email: email,
            country: country,
            companyName: companyName,
            createdAt: new Date()
          });

          showMessage(registerMessage, '¡Cuenta creada! Inicia sesión para continuar.', 'success');
          registerForm.reset();
          setLoading('btn-register-submit', 'register-spinner', 'register-btn-text', false, 'Crear mi cuenta');
          
          setTimeout(() => {
            switchTab('login');
          }, 1500);

        } catch (error) {
          console.error(error);
          setLoading('btn-register-submit', 'register-spinner', 'register-btn-text', false, 'Crear mi cuenta');
          if (error.code === 'auth/email-already-in-use') {
            showMessage(registerMessage, 'El correo electrónico ya está registrado.', 'error');
          } else {
            showMessage(registerMessage, 'Error al registrar usuario: ' + error.message, 'error');
          }
        }
      });
    </script>
  </body>
</html>
